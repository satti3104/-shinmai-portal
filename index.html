<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHINMAI HUD V3</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
}

body{
  color:#fff;
  font-family:-apple-system,"Noto Sans JP","Hiragino Sans",
              "Yu Gothic",sans-serif;
  overflow:hidden;
}

main{
  width:min(100vw,600px);
  height:min(100vh,600px);
  margin:auto;
  padding:28px;
  background:
    radial-gradient(circle at top,#0b2a38,#02090d 55%,#000);
}

.label{
  color:#b8d0da;
  font-size:14px;
  font-weight:700;
  letter-spacing:2px;
}

.clock{
  margin-top:10px;
  font-size:78px;
  font-weight:800;
  line-height:1;
}

.date{
  margin-top:14px;
  color:#fff;
  font-size:29px;
  font-weight:800;
  line-height:1.3;
  letter-spacing:1px;
}

.panel{
  margin-top:27px;
  padding:21px;
  border:1px solid #7b9eab;
  border-radius:20px;
  background:#07151c;
}

.location{
  font-size:23px;
  font-weight:800;
  line-height:1.4;
}

.weather{
  margin-top:17px;
  font-size:32px;
  font-weight:800;
  line-height:1.25;
}

.details{
  margin-top:13px;
  color:#d9e5ea;
  font-size:17px;
  font-weight:600;
  line-height:1.65;
}

.status{
  margin-top:16px;
  color:#bdd0d8;
  font-size:14px;
  font-weight:700;
  line-height:1.5;
}

.enable{
  margin-top:16px;
  padding:15px 12px;
  width:100%;
  border:2px solid #fff;
  border-radius:14px;
  background:#102832;
  color:#fff;
  font-size:20px;
  font-weight:800;
  text-align:center;
  cursor:pointer;
}

.enable:focus{
  outline:3px solid #fff;
  outline-offset:3px;
}

.hidden{
  display:none;
}

.error{
  font-size:19px;
  font-weight:800;
}
</style>
</head>

<body>

<main>

  <div class="label">SHINMAI HUD V3</div>

  <div id="clock" class="clock">--:--</div>

  <div id="date" class="date">--</div>


  <div class="panel">

    <div id="location" class="location">
      現在地：未取得
    </div>

    <div id="weather" class="weather">
      天気：待機中
    </div>

    <div id="details" class="details"></div>


    <!--
      新米ではここを決定。
      スマホ/PCではタップ・クリック。
    -->

    <button
      id="enableLocation"
      class="enable"
      type="button"
      autofocus
    >
      位置情報を有効にする
    </button>

  </div>


  <div id="status" class="status">
    決定して現在地を取得
  </div>

</main>


<script>

/* =====================================
   CLOCK
===================================== */

function updateClock(){

  const d = new Date();

  document.getElementById("clock").textContent =
    d.toLocaleTimeString(
      "ja-JP",
      {
        hour:"2-digit",
        minute:"2-digit",
        hour12:false
      }
    );

  const week =
    ["日","月","火","水","木","金","土"];

  document.getElementById("date").textContent =
    `${d.getMonth()+1}月${d.getDate()}日 ${week[d.getDay()]}曜日`;
}

updateClock();

setInterval(updateClock,1000);



/* =====================================
   WEATHER CODE
===================================== */

const weatherCodes = {

  0:"快晴",
  1:"晴れ",
  2:"一部くもり",
  3:"くもり",

  45:"霧",
  48:"霧",

  51:"霧雨",
  53:"霧雨",
  55:"強い霧雨",

  61:"小雨",
  63:"雨",
  65:"強い雨",

  71:"小雪",
  73:"雪",
  75:"大雪",

  80:"にわか雨",
  81:"にわか雨",
  82:"激しい雨",

  95:"雷雨",
  96:"雷雨",
  99:"激しい雷雨"
};



/* =====================================
   ELEMENTS
===================================== */

const locationText =
  document.getElementById("location");

const weatherText =
  document.getElementById("weather");

const details =
  document.getElementById("details");

const status =
  document.getElementById("status");

const enableButton =
  document.getElementById("enableLocation");

let locationEnabled = false;



/* =====================================
   LOCATION
===================================== */

function requestLocation(){

  if(!navigator.geolocation){

    locationText.textContent =
      "位置情報API非対応";

    weatherText.textContent =
      "天気取得不可";

    status.textContent =
      "GEOLOCATION NOT SUPPORTED";

    return;
  }


  enableButton.disabled = true;

  enableButton.textContent =
    "現在地を取得中…";

  locationText.textContent =
    "現在地を取得中…";

  weatherText.textContent =
    "天気情報待ち";

  status.textContent =
    "PHONE GPS CONNECTING";


  navigator.geolocation.getCurrentPosition(

    async position => {

      locationEnabled = true;

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;


      /* 成功したらボタンを消す */

      enableButton.classList.add("hidden");


      locationText.textContent =
        `${lat.toFixed(4)}, ${lon.toFixed(4)}`;

      status.textContent =
        "LOCATION OK";


      /* ===============================
         REVERSE GEOCODING
      =============================== */

      try{

        const reverseURL =
          "https://api.bigdatacloud.net/data/reverse-geocode-client" +
          `?latitude=${lat}` +
          `&longitude=${lon}` +
          "&localityLanguage=ja";


        const response =
          await fetch(reverseURL);


        if(!response.ok){
          throw new Error("Reverse geocode error");
        }


        const data =
          await response.json();


        const pref =
          data.principalSubdivision || "";

        const city =
          data.locality ||
          data.city ||
          "";


        if(pref || city){

          locationText.textContent =
            [pref,city]
              .filter(Boolean)
              .join(" ");

        }

      }
      catch(error){

        /* 失敗時は座標をそのまま残す */

      }


      /* ===============================
         WEATHER
      =============================== */

      await loadWeather(lat,lon);

    },


    error => {

      enableButton.disabled = false;

      enableButton.textContent =
        "位置情報を再試行";


      const names = {

        1:"PERMISSION DENIED",

        2:"POSITION UNAVAILABLE",

        3:"TIMEOUT"

      };


      const name =
        names[error.code] ||
        "UNKNOWN ERROR";


      locationText.innerHTML =
        '<span class="error">現在地を取得できません</span>';

      weatherText.textContent =
        "位置情報待ち";


      status.innerHTML =
        `GEO ERROR ${error.code}<br>${name}`;

    },


    {
      enableHighAccuracy:true,

      timeout:30000,

      maximumAge:300000
    }

  );

}



/* =====================================
   WEATHER
===================================== */

async function loadWeather(lat,lon){

  try{

    weatherText.textContent =
      "天気を取得中…";


    const url =
      "https://api.open-meteo.com/v1/forecast" +

      `?latitude=${lat}` +

      `&longitude=${lon}` +

      "&current=" +
      "temperature_2m," +
      "apparent_temperature," +
      "weather_code," +
      "precipitation," +
      "wind_speed_10m" +

      "&timezone=auto";


    const response =
      await fetch(url);


    if(!response.ok){

      throw new Error(
        "Weather API error"
      );

    }


    const data =
      await response.json();


    const current =
      data.current;


    const description =
      weatherCodes[current.weather_code] ||
      "現在の天気";


    weatherText.textContent =
      `${current.temperature_2m}℃　${description}`;


    details.innerHTML =

      `体感　${current.apparent_temperature}℃<br>` +

      `降水　${current.precipitation} mm<br>` +

      `風速　${current.wind_speed_10m} km/h`;


    const now =
      new Date();


    status.textContent =

      "LIVE　" +

      String(
        now.getHours()
      ).padStart(2,"0")

      + ":" +

      String(
        now.getMinutes()
      ).padStart(2,"0")

      + " 更新";

  }

  catch(error){

    weatherText.textContent =
      "天気取得エラー";

    status.textContent =
      "WEATHER ERROR";

  }

}



/* =====================================
   USER ACTION
===================================== */

/*
  重要：
  ページロード時には位置情報を要求しない。

  このユーザー操作を受けてから
  Geolocation APIを呼ぶ。
*/

enableButton.addEventListener(
  "click",
  requestLocation
);



/*
  新米側の決定操作が
  Enterとして渡された場合にも対応。
*/

document.addEventListener(
  "keydown",
  event => {

    if(
      !locationEnabled &&
      (
        event.key === "Enter" ||
        event.key === " "
      )
    ){

      event.preventDefault();

      requestLocation();

    }

  }
);



/* =====================================
   AUTO UPDATE
===================================== */

/*
  初回permission取得後のみ
  10分ごとに再取得。
*/

setInterval(
  () => {

    if(locationEnabled){

      requestLocation();

    }

  },

  600000
);

</script>

</body>
</html>
