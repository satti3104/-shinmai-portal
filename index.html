<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHINMAI HUD V3.1</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
}

body{
  color:#fff;
  font-family:-apple-system,"Noto Sans JP","Hiragino Sans",
              "Yu Gothic",sans-serif;
  overflow:hidden;
}

main{
  width:min(100vw,600px);
  height:min(100vh,600px);
  margin:auto;
  padding:24px;
  background:radial-gradient(circle at top,#0b2a38,#02090d 55%,#000);
}

.label{
  color:#b8d0da;
  font-size:13px;
  font-weight:700;
  letter-spacing:2px;
}

.clock{
  margin-top:8px;
  font-size:76px;
  font-weight:800;
  line-height:1;
}

.date{
  margin-top:10px;
  color:#fff;
  font-size:28px;
  font-weight:800;
  line-height:1.2;
}

.panel{
  margin-top:20px;
  padding:18px;
  border:1px solid #7b9eab;
  border-radius:18px;
  background:#07151c;
}

.location{
  font-size:22px;
  font-weight:800;
  line-height:1.35;
}

.weather{
  margin-top:14px;
  font-size:30px;
  font-weight:800;
}

.details{
  margin-top:10px;
  color:#d9e5ea;
  font-size:16px;
  font-weight:600;
  line-height:1.5;
}

.enable{
  margin-top:14px;
  padding:13px 10px;
  width:100%;
  border:2px solid #fff;
  border-radius:13px;
  background:#102832;
  color:#fff;
  font-size:19px;
  font-weight:800;
}

.errorBox{
  margin-top:12px;
  padding:12px;
  border:2px solid #fff;
  border-radius:12px;
  font-size:20px;
  font-weight:800;
  line-height:1.4;
}

.errorCode{
  font-size:30px;
  font-weight:900;
}

.status{
  margin-top:12px;
  color:#bdd0d8;
  font-size:13px;
  font-weight:700;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<main>

<div class="label">SHINMAI HUD V3.1</div>

<div id="clock" class="clock">--:--</div>

<div id="date" class="date">--</div>

<div class="panel">

  <div id="location" class="location">
    現在地：未取得
  </div>

  <div id="weather" class="weather">
    天気：待機中
  </div>

  <div id="details" class="details"></div>

  <div id="errorBox" class="errorBox hidden"></div>

  <button
    id="enableLocation"
    class="enable"
    type="button"
    autofocus
  >
    位置情報を有効にする
  </button>

</div>

<div id="status" class="status">
  決定して現在地を取得
</div>

</main>

<script>

/* CLOCK */

function updateClock(){

  const d = new Date();

  document.getElementById("clock").textContent =
    d.toLocaleTimeString("ja-JP",{
      hour:"2-digit",
      minute:"2-digit",
      hour12:false
    });

  const week =
    ["日","月","火","水","木","金","土"];

  document.getElementById("date").textContent =
    `${d.getMonth()+1}月${d.getDate()}日 ${week[d.getDay()]}曜日`;
}

updateClock();
setInterval(updateClock,1000);


/* WEATHER */

const weatherCodes = {
  0:"快晴",
  1:"晴れ",
  2:"一部くもり",
  3:"くもり",
  45:"霧",
  48:"霧",
  51:"霧雨",
  53:"霧雨",
  55:"強い霧雨",
  61:"小雨",
  63:"雨",
  65:"強い雨",
  71:"小雪",
  73:"雪",
  75:"大雪",
  80:"にわか雨",
  81:"にわか雨",
  82:"激しい雨",
  95:"雷雨",
  96:"雷雨",
  99:"激しい雷雨"
};


const locationText =
  document.getElementById("location");

const weatherText =
  document.getElementById("weather");

const details =
  document.getElementById("details");

const status =
  document.getElementById("status");

const button =
  document.getElementById("enableLocation");

const errorBox =
  document.getElementById("errorBox");

let locationEnabled = false;
let requesting = false;


/* LOCATION */

function requestLocation(){

  if(requesting) return;

  if(!navigator.geolocation){

    errorBox.classList.remove("hidden");

    errorBox.innerHTML =
      '<div class="errorCode">GEO UNSUPPORTED</div>' +
      '位置情報APIが利用できません';

    return;
  }

  requesting = true;

  errorBox.classList.add("hidden");

  button.disabled = true;
  button.textContent = "現在地を取得中…";

  locationText.textContent =
    "現在地を取得中…";

  weatherText.textContent =
    "天気情報待ち";

  status.textContent =
    "PHONE GPS CONNECTING";


  navigator.geolocation.getCurrentPosition(

    async position => {

      requesting = false;
      locationEnabled = true;

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;

      button.classList.add("hidden");
      errorBox.classList.add("hidden");

      locationText.textContent =
        `${lat.toFixed(4)}, ${lon.toFixed(4)}`;

      status.textContent =
        "LOCATION OK";


      /* 地名 */

      try{

        const url =
          "https://api.bigdatacloud.net/data/reverse-geocode-client" +
          `?latitude=${lat}` +
          `&longitude=${lon}` +
          "&localityLanguage=ja";

        const response =
          await fetch(url);

        const data =
          await response.json();

        const pref =
          data.principalSubdivision || "";

        const city =
          data.locality ||
          data.city ||
          "";

        if(pref || city){

          locationText.textContent =
            [pref,city]
              .filter(Boolean)
              .join(" ");

        }

      }catch(e){}


      await loadWeather(lat,lon);

    },


    error => {

      requesting = false;

      button.disabled = false;

      button.textContent =
        "位置情報を再試行";


      const names = {
        1:"PERMISSION DENIED",
        2:"POSITION UNAVAILABLE",
        3:"TIMEOUT"
      };

      const name =
        names[error.code] ||
        "UNKNOWN ERROR";


      locationText.textContent =
        "現在地を取得できません";

      weatherText.textContent =
        "位置情報待ち";


      /* ★中央にエラーを大表示 */

      errorBox.classList.remove("hidden");

      errorBox.innerHTML =
        `<div class="errorCode">GEO ERROR ${error.code}</div>` +
        `${name}`;


      status.textContent =
        "LOCATION FAILED";

    },


    {
      enableHighAccuracy:true,
      timeout:30000,
      maximumAge:300000
    }

  );
}


/* WEATHER */

async function loadWeather(lat,lon){

  try{

    weatherText.textContent =
      "天気を取得中…";

    const url =
      "https://api.open-meteo.com/v1/forecast" +
      `?latitude=${lat}` +
      `&longitude=${lon}` +
      "&current=" +
      "temperature_2m," +
      "apparent_temperature," +
      "weather_code," +
      "precipitation," +
      "wind_speed_10m" +
      "&timezone=auto";

    const response =
      await fetch(url);

    if(!response.ok)
      throw new Error();

    const data =
      await response.json();

    const w =
      data.current;

    const description =
      weatherCodes[w.weather_code] ||
      "現在の天気";


    weatherText.textContent =
      `${w.temperature_2m}℃　${description}`;


    details.innerHTML =
      `体感　${w.apparent_temperature}℃<br>` +
      `降水　${w.precipitation} mm<br>` +
      `風速　${w.wind_speed_10m} km/h`;


    const now =
      new Date();

    status.textContent =
      "LIVE　" +
      String(now.getHours()).padStart(2,"0") +
      ":" +
      String(now.getMinutes()).padStart(2,"0") +
      " 更新";

  }

  catch(e){

    weatherText.textContent =
      "天気取得エラー";

    status.textContent =
      "WEATHER ERROR";

  }
}


/* USER ACTION */

button.addEventListener(
  "click",
  requestLocation
);


/* 新米の決定キー対策 */

document.addEventListener(
  "keydown",
  event => {

    if(
      !locationEnabled &&
      !requesting &&
      (
        event.key === "Enter" ||
        event.key === " "
      )
    ){
      event.preventDefault();
      requestLocation();
    }

  }
);


/* 成功後10分ごとに更新 */

setInterval(
  () => {

    if(locationEnabled){
      requestLocation();
    }

  },
  600000
);

</script>

</body>
</html>
