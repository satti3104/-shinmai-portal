<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHINMAI HUD</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#000;
  color:#f5fbff;
  font-family:-apple-system,"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
}

main{
  width:min(100vw,600px);
  height:min(100vh,600px);
  margin:auto;
  padding:28px;
  background:radial-gradient(circle at top,#0b2a38,#02090d 55%,#000);
}

.label{
  color:#8fa9b5;
  font-size:14px;
  letter-spacing:2px;
}

.clock{
  font-size:76px;
  font-weight:700;
  line-height:1;
  margin-top:12px;
}

.date{
  margin-top:8px;
  color:#a9bbc4;
  font-size:17px;
}

.panel{
  margin-top:30px;
  padding:20px;
  border:1px solid #477080;
  border-radius:20px;
  background:#07151c;
}

.location{
  font-size:22px;
  font-weight:650;
}

.weather{
  margin-top:18px;
  font-size:32px;
  font-weight:700;
}

.details{
  margin-top:12px;
  font-size:15px;
  color:#a9bbc4;
  line-height:1.7;
}

.status{
  margin-top:18px;
  font-size:12px;
  color:#718995;
}
</style>
</head>

<body>

<main>

<div class="label">SHINMAI HUD</div>

<div id="clock" class="clock">--:--</div>
<div id="date" class="date"></div>

<div class="panel">

  <div id="location" class="location">
    📍 現在地を取得中…
  </div>

  <div id="weather" class="weather">
    天気を取得中…
  </div>

  <div id="details" class="details"></div>

</div>

<div id="status" class="status">
位置情報を確認しています
</div>

</main>

<script>

function updateClock(){

  const d=new Date();

  document.getElementById("clock").textContent=
    d.toLocaleTimeString("ja-JP",{
      hour:"2-digit",
      minute:"2-digit",
      hour12:false
    });

  const week=["日","月","火","水","木","金","土"];

  document.getElementById("date").textContent=
    `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${week[d.getDay()]}）`;
}

updateClock();
setInterval(updateClock,1000);


const weatherCodes={
  0:["☀️","快晴"],
  1:["🌤️","晴れ"],
  2:["⛅","一部くもり"],
  3:["☁️","くもり"],
  45:["🌫️","霧"],
  48:["🌫️","霧"],
  51:["🌦️","霧雨"],
  53:["🌦️","霧雨"],
  55:["🌧️","強い霧雨"],
  61:["🌧️","小雨"],
  63:["🌧️","雨"],
  65:["🌧️","強い雨"],
  71:["🌨️","小雪"],
  73:["🌨️","雪"],
  75:["❄️","大雪"],
  80:["🌦️","にわか雨"],
  81:["🌧️","にわか雨"],
  82:["⛈️","激しい雨"],
  95:["⛈️","雷雨"],
  96:["⛈️","雷雨"],
  99:["⛈️","激しい雷雨"]
};


async function loadWeather(){

  const location=document.getElementById("location");
  const weather=document.getElementById("weather");
  const details=document.getElementById("details");
  const status=document.getElementById("status");

  if(!navigator.geolocation){

    location.textContent="📍 位置情報非対応";
    weather.textContent="天気を取得できません";

    return;
  }


  navigator.geolocation.getCurrentPosition(

  async pos=>{

    const lat=pos.coords.latitude;
    const lon=pos.coords.longitude;

    location.textContent=
      `📍 ${lat.toFixed(4)}, ${lon.toFixed(4)}`;

    status.textContent="現在地取得済み";


    /* 現在地名 */

    try{

      const r=await fetch(
        `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ja`
      );

      const j=await r.json();

      const city=j.locality || j.city || "";
      const pref=j.principalSubdivision || "";

      if(city || pref){

        location.textContent=
          "📍 "+[pref,city].filter(Boolean).join(" ");

      }

    }catch(e){}


    /* 天気 */

    try{

      const url=
        `https://api.open-meteo.com/v1/forecast`+
        `?latitude=${lat}`+
        `&longitude=${lon}`+
        `&current=temperature_2m,apparent_temperature,weather_code,precipitation,wind_speed_10m`+
        `&timezone=auto`;

      const r=await fetch(url);

      const data=await r.json();

      const w=data.current;

      const info=
        weatherCodes[w.weather_code] ||
        ["🌡️","現在の天気"];

      weather.textContent=
        `${info[0]} ${w.temperature_2m}℃　${info[1]}`;

      details.innerHTML=
        `体感温度　${w.apparent_temperature}℃<br>`+
        `降水量　　${w.precipitation} mm<br>`+
        `風速　　　${w.wind_speed_10m} km/h`;

      status.textContent=
        "● LIVE　10分ごとに更新";

    }catch(e){

      weather.textContent=
        "天気を取得できません";

      status.textContent=
        "天気情報取得エラー";

    }

  },

  err=>{

    location.textContent=
      "📍 位置情報を許可してください";

    weather.textContent=
      "位置情報待ち";

    status.textContent=
      "位置情報へのアクセスが必要です";

  },

  {
    enableHighAccuracy:true,
    timeout:12000,
    maximumAge:300000
  });

}

loadWeather();

setInterval(loadWeather,600000);

</script>

</body>
</html>
