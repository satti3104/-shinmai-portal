<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHINMAI PORTAL V3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#f5fbff;font-family:-apple-system,"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}main{width:min(100vw,600px);height:min(100vh,600px);margin:auto;padding:24px;background:radial-gradient(circle at top,#0b2a38,#02090d 55%,#000);overflow:auto}.view{display:none}.view.on{display:block}.top,.head{display:flex;justify-content:space-between;align-items:center;color:#9bb1bd}.clock{font-size:54px;font-weight:700;margin:14px 0 0}.muted,.status{color:#9bb1bd;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.card,.btn,.result,.chip{border:1px solid #477080;border-radius:16px;background:#07151c;color:#f5fbff}.card{height:135px;padding:16px;text-align:left}.card:focus,.btn:focus,.result:focus,.chip:focus{outline:3px solid #c9f4ff}.icon{font-size:36px;font-weight:800}.name{font-size:21px;margin-top:18px}.btn,.chip{padding:10px 12px}.row{display:flex;gap:7px;margin:10px 0}.row input{min-width:0;flex:1;padding:12px;border-radius:12px;border:1px solid #477080;background:#061219;color:white;font-size:16px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.results{display:grid;gap:8px}.result{display:grid;grid-template-columns:112px 1fr;gap:9px;padding:8px;text-align:left}.thumb{width:112px;aspect-ratio:16/9;object-fit:cover;border-radius:9px}.title{font-size:14px;font-weight:650;line-height:1.25}.channel{font-size:11px;color:#9bb1bd;margin-top:4px}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;margin-top:10px}.mic.listening{outline:3px solid #c9f4ff}.jp{font-size:12px;color:#c9f4ff}
</style></head><body><main>
<section id="home" class="view on"><div class="top"><span>SHINMAI PORTAL V3</span><span>日本語 HUD</span></div><div id="clock" class="clock">--:--</div><div id="date" class="muted"></div><div class="grid">
<button class="card" onclick="show('x')"><div class="icon">𝕏</div><div class="name">X</div></button><button class="card" onclick="show('yt')"><div class="icon">▶</div><div class="name">YouTube</div></button>
<button class="card" onclick="location.href='./calendar/'"><div class="icon">31</div><div class="name">カレンダー</div></button><button class="card" onclick="show('status')"><div class="icon">◎</div><div class="name">状態</div></button></div></section>

<section id="x" class="view"><button class="btn" onclick="show('home')">‹ ポータル</button><h2>𝕏 X</h2><div class="row"><input id="xq" lang="ja" inputmode="search" enterkeyhint="search" placeholder="日本語で検索"><button class="btn" onclick="openX()">検索</button></div></section>

<section id="yt" class="view"><div class="head"><button class="btn" onclick="show('home')">‹ ポータル</button><button id="authBtn" class="btn" onclick="authorizeYT()">Googleログイン</button></div>
<h2>▶ YouTube <span class="jp">日本語検索</span></h2>
<div id="account" class="muted" hidden><span id="accountName"></span> 接続済み</div>
<div class="row"><input id="ytq" lang="ja" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="日本語で動画を検索"><button id="micBtn" class="btn mic" onclick="voiceSearch()">🎙️</button><button class="btn" onclick="searchYT()">検索</button></div>
<div class="chips"><button class="chip" onclick="quick('スマートグラス')">スマートグラス</button><button class="chip" onclick="quick('Meta Ray-Ban Display')">Meta Display</button><button class="chip" onclick="quick('ガジェットニュース')">ガジェット</button><button class="chip" onclick="loadSubs()">登録チャンネル</button></div>
<div id="voiceHelp" class="status">🎙️はブラウザ音声認識対応時のみ使用。非対応ならスマホ日本語入力を使用。</div><div id="ytStatus" class="status">YouTube Data API v3</div>
<iframe id="player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen hidden></iframe><div id="results" class="results"></div></section>

<section id="status" class="view"><button class="btn" onclick="show('home')">‹ ポータル</button><h2>システム状態</h2><p>Portal V3<br>日本語UI / 日本語検索<br>音声検索フォールバック<br>24時間表示 / 600×600</p></section>
</main><script>
const YT_API_KEY="YOUR_YOUTUBE_API_KEY", GOOGLE_CLIENT_ID="YOUR_GOOGLE_OAUTH_CLIENT_ID.apps.googleusercontent.com";
const YT_SCOPE="https://www.googleapis.com/auth/youtube.readonly";let tokenClient=null,accessToken=null;
const views=[...document.querySelectorAll(".view")];function show(id){views.forEach(v=>v.classList.toggle("on",v.id===id))}
function tick(){let d=new Date(),w="日月火水木金土";clock.textContent=d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit",hour12:false});date.textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${w[d.getDay()]}）`}tick();setInterval(tick,1000);
function openX(){let q=xq.value.trim();location.href="https://x.com/search?q="+encodeURIComponent(q)+"&src=typed_query"}
function loadGIS(){let s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=()=>{if(!GOOGLE_CLIENT_ID.startsWith("YOUR_"))tokenClient=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:YT_SCOPE,callback:r=>{if(r.error)return msg("ログイン失敗");accessToken=r.access_token;loadAccount()}})};document.head.appendChild(s)}loadGIS();
function authorizeYT(){if(GOOGLE_CLIENT_ID.startsWith("YOUR_"))return msg("Client IDを設定してください");if(!tokenClient)return msg("Google認証準備中…");tokenClient.requestAccessToken({prompt:"consent"})}
function msg(s){ytStatus.textContent=s}
async function api(path,params={},auth=false){let u=new URL("https://www.googleapis.com/youtube/v3/"+path);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));if(!auth)u.searchParams.set("key",YT_API_KEY);let r=await fetch(u,{headers:auth&&accessToken?{Authorization:"Bearer "+accessToken}:{}}),j=await r.json();if(!r.ok)throw Error(j.error?.message||"APIエラー");return j}
async function searchYT(){let q=ytq.value.trim();if(!q)return msg("検索語を入力してください");if(YT_API_KEY.startsWith("YOUR_"))return msg("API Keyを設定してください");msg("「"+q+"」を検索中…");try{let j=await api("search",{part:"snippet",q,type:"video",maxResults:"8",relevanceLanguage:"ja",regionCode:"JP",safeSearch:"moderate"});render(j.items);msg(j.items.length+"件表示")}catch(e){msg("検索エラー: "+e.message)}}
function quick(q){ytq.value=q;searchYT()}
function render(a){player.hidden=true;results.innerHTML=a.map(x=>`<button class="result" onclick="play('${x.id.videoId}')"><img class="thumb" src="${x.snippet.thumbnails.medium?.url||x.snippet.thumbnails.default.url}"><div><div class="title">${esc(x.snippet.title)}</div><div class="channel">${esc(x.snippet.channelTitle)}</div></div></button>`).join("")}
function play(id){player.hidden=false;player.src=`https://www.youtube.com/embed/${id}?playsinline=1&controls=1&hl=ja&autoplay=1&origin=${encodeURIComponent(location.origin)}`;player.scrollIntoView({behavior:"smooth"})}
async function loadAccount(){try{let j=await api("channels",{part:"snippet",mine:"true"},true),c=j.items?.[0];if(c){account.hidden=false;accountName.textContent=c.snippet.title}authBtn.textContent="再ログイン";msg("YouTube接続済み")}catch(e){msg("アカウント取得エラー")}}
async function loadSubs(){if(!accessToken)return msg("先にGoogleログインしてください");try{let j=await api("subscriptions",{part:"snippet",mine:"true",maxResults:"10",order:"alphabetical"},true);results.innerHTML=j.items.map(x=>`<button class="result" onclick="quick('${attr(x.snippet.title)}')"><img class="thumb" src="${x.snippet.thumbnails.medium?.url||x.snippet.thumbnails.default.url}"><div><div class="title">${esc(x.snippet.title)}</div><div class="channel">登録チャンネル</div></div></button>`).join("");msg(j.items.length+"チャンネル表示")}catch(e){msg("取得エラー")}}
function voiceSearch(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){voiceHelp.textContent="このWeb App環境では音声認識APIが利用できません。検索欄を選択し、スマホ側の日本語音声入力/キーボードを使ってください。";ytq.focus();return}let r=new SR();r.lang="ja-JP";r.interimResults=false;r.maxAlternatives=1;micBtn.classList.add("listening");voiceHelp.textContent="日本語で話してください…";r.onresult=e=>{ytq.value=e.results[0][0].transcript;voiceHelp.textContent="認識: "+ytq.value;searchYT()};r.onerror=e=>voiceHelp.textContent="音声認識エラー: "+e.error;r.onend=()=>micBtn.classList.remove("listening");r.start()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function attr(s){return esc(s).replace(/`/g,"&#96;")}
ytq.addEventListener("keydown",e=>{if(e.key==="Enter")searchYT()});addEventListener("keydown",e=>{if(e.key==="Escape")show("home")});
</script></body></html>
