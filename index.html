<script>
async function loadWeather(lat, lon){

  try{

    weatherText.textContent = "天気取得中";

    const url =
      "https://api.open-meteo.com/v1/forecast" +

      `?latitude=${lat}` +
      `&longitude=${lon}` +

      "&current=" +
      "temperature_2m," +
      "apparent_temperature," +
      "weather_code," +
      "precipitation" +

      "&hourly=" +
      "precipitation_probability," +
      "precipitation" +

      "&forecast_days=2" +
      "&timezone=auto";


    const r = await fetch(url);

    if(!r.ok){
      throw new Error();
    }

    const data = await r.json();

    const w = data.current;

    const description =
      weatherCodes[w.weather_code] ||
      "現在の天気";


    /* 現在の天気 */

    weatherText.textContent =
      `${w.temperature_2m}℃  ${description}`;


    /* =========================
       次の降雨予想を検索
    ========================= */

    let rainText = "雨予想なし";

    const times =
      data.hourly.time;

    const probabilities =
      data.hourly.precipitation_probability;

    const precipitation =
      data.hourly.precipitation;


    const now = new Date();


    for(let i = 0; i < times.length; i++){

      const forecastTime =
        new Date(times[i]);


      /* 過去の予報は無視 */

      if(forecastTime <= now){
        continue;
      }


      const probability =
        probabilities[i] ?? 0;

      const amount =
        precipitation[i] ?? 0;


      /*
        雨判定

        ・降水確率30%以上
        または
        ・予想降水量0.1mm以上
      */

      if(
        probability >= 30 ||
        amount >= 0.1
      ){

        const hour =
          String(
            forecastTime.getHours()
          ).padStart(2,"0");


        rainText =
          `雨 ${hour}:00〜 ${probability}%`;

        break;
      }

    }


    /* =========================
       補助情報
    ========================= */

    details.innerHTML =
      `体感 ${w.apparent_temperature}℃　降水 ${w.precipitation}mm<br>` +
      `${rainText}`;


    /* LIVE */

    status.textContent =
      "● LIVE  " +

      String(
        now.getHours()
      ).padStart(2,"0")

      + ":" +

      String(
        now.getMinutes()
      ).padStart(2,"0");


  }

  catch(e){

    weatherText.textContent =
      "天気取得失敗";

    status.textContent =
      "WEATHER ERROR";

  }

}
</script>
